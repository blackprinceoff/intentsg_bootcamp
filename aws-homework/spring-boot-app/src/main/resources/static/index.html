<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day | Spring Boot on EC2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .quote-card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .quote-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
        }

        .quote-text {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .quote-text::before {
            content: '"';
            font-size: 4rem;
            color: rgba(59, 130, 246, 0.2);
            position: absolute;
            top: -20px;
            left: -15px;
            z-index: -1;
            font-family: serif;
        }

        .quote-author {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
            font-style: italic;
        }

        .quote-author::before {
            content: '— ';
        }

        .btn-container {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .badge {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
        }

        .loader {
            display: none;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">AWS EC2 Deployment</span>
            <h1>Quote API</h1>
            <p>Spring Boot Application running in Docker</p>
        </div>

        <div class="quote-card" id="quoteCard">
            <div class="loader" id="loader"></div>
            <div id="quoteContent">
                <p class="quote-text" id="quoteText">Click the button below to fetch a quote.</p>
                <p class="quote-author" id="quoteAuthor">Spring Boot</p>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" id="fetchBtn" onclick="fetchQuote()">Get Random Quote</button>
        </div>
    </div>

    <div class="footer">
        <p>Homework Assignment — Backend deployed via Docker on Amazon EC2.</p>
    </div>

    <script>
        async function fetchQuote() {
            const textEl = document.getElementById('quoteText');
            const authorEl = document.getElementById('quoteAuthor');
            const loader = document.getElementById('loader');
            const content = document.getElementById('quoteContent');

            content.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Fetching from our local Spring Boot REST API
                const response = await fetch('/api/quote');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const data = await response.json();
                
                textEl.textContent = data.text;
                authorEl.textContent = data.author;
            } catch (error) {
                console.error('Error fetching quote:', error);
                textEl.textContent = 'Oops! Failed to load quote. Is the API running?';
                authorEl.textContent = 'Error';
            } finally {
                loader.style.display = 'none';
                content.style.display = 'block';
            }
        }

        // Fetch a quote on initial load
        document.addEventListener('DOMContentLoaded', fetchQuote);
    </script>
</body>
</html>
