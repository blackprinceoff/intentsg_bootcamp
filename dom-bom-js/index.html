<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Мої задачі</h1>

    <div class="input-wrap">
      <input type="text" id="task-input" placeholder="Нова задача...">
      <button id="add-btn">Додати</button>
    </div>

    <p id="counter">Виконано 0 з 0</p>

    <ul id="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
